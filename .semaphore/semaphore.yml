version: v1.0
name: CI Pipeline
agent:
  machine:
    type: f1-standard-4
    os_image: ubuntu2404
  containers:
    - name: main
      image: 'semaphoreci/ubuntu:24.04'
fail_fast:
  stop:
    when: branch != 'main'
auto_cancel:
  running:
    when: branch != 'main'
  queued:
    when: branch = 'main'
blocks:
  - name: Init
    dependencies: []
    task:
      jobs:
        - name: Initialize
          commands:
            - checkout
            - cd 1-terraform-apply
            - terraform init
            - artifact push workflow .terraform
            - artifact push workflow .terraform.lock.hcl
  - name: Deploy
    dependencies:
      - Init
    task:
      jobs:
        - name: Deploy
          commands:
            - checkout
            - cd 1-terraform-apply
            - artifacts pull workflow .terraform
            - artifacts pull workflow .terraform.lock.hcl
            - terraform validate
            - terraform apply -auto-approve
            - artifacts push workflow terraform.tfstate
  - name: Use bucket
    dependencies:
      - Deploy
    task:
      jobs:
        - name: Use
          commands:
            - checkout
            - cd 1-terraform-apply
            - 'aws s3 cp README.md s3://joksimovic-test-bucket/'''
            - 'aws s3 ls s3://joksimovic-test-bucket'
            - 'aws s3 rm s3://joksimovic-test-bucket/README.md'
  - name: Destroy
    dependencies:
      - Use bucket
    task:
      jobs:
        - name: Destroy
          commands:
            - artifacts pull workflow .terraform
            - artifacts pull workflow .terraform.lock.hcl
            - artifacts pull workflow terraform.tfstate
            - terraform destroy -auto-approve